<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>教室直播</title>
<style>
  :root {
    --bg: #0e1116;
    --bar: rgba(22, 27, 34, 0.92);
    --fg: #e6edf3;
    --muted: #8b949e;
    --line: #30363d;
    --btn: #21262d;
    --btn-hover: #30363d;
    --accent: #2f81f7;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    overflow: hidden; }

  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; touch-action: none; }
  #stage.zoomed { cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #video { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    object-fit: contain; transform-origin: 0 0; background: #000; }

  /* 上方工具列 */
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; padding: 8px 10px; background: var(--bar); border-bottom: 1px solid var(--line);
    transition: opacity .25s, transform .25s; z-index: 10; font-size: 14px; }
  #bar.hidden { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  .group { display: flex; align-items: center; gap: 4px; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--fg); background: var(--btn); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--btn-hover); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  #status { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; }
  #dot.ok { background: var(--ok); }
  #dot.err { background: var(--err); }
  #zoomLabel { min-width: 48px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  a.small { color: var(--muted); font-size: 12px; }

  /* 等待/錯誤提示 */
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 5; }
  #overlay .card { background: rgba(22,27,34,.9); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 28px; text-align: center; max-width: 420px; margin: 16px; }
  #overlay .title { font-size: 20px; margin-bottom: 6px; }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 1.6; }
  #overlay.hidden { display: none; }

  /* 說明 */
  #help { position: fixed; right: 10px; top: 56px; z-index: 11; background: var(--bar);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 13px;
    line-height: 1.9; display: none; }
  #help.show { display: block; }
  kbd { background: var(--btn); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
</div>

<div id="overlay">
  <div class="card">
    <div class="title" id="ovTitle">連線中…</div>
    <div class="sub" id="ovSub">正在連線到教師電腦</div>
  </div>
</div>

<div id="bar">
  <div class="group" id="streamBtns"></div>
  <div class="sep"></div>
  <div id="status"><span id="dot"></span><span id="statusText">連線中</span></div>
  <span id="stats"></span>
  <div class="spacer"></div>
  <div class="group">
    <button id="zoomOut" title="縮小（-）">－</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" title="放大（+）">＋</button>
    <button id="zoomReset" title="還原（0）">還原</button>
  </div>
  <div class="sep"></div>
  <button id="pipBtn" title="子母畫面：浮在其他視窗上方（P）">子母畫面</button>
  <button id="fsBtn" title="全螢幕（F）">全螢幕</button>
  <button id="reBtn" title="重新連線（R）">重新連線</button>
  <button id="helpBtn" title="說明（?）">?</button>
</div>

<div id="help">
  <b>操作說明</b><br>
  <kbd>滾輪</kbd> 以游標位置放大／縮小，放大後可<kbd>拖曳</kbd>移動<br>
  <kbd>雙擊</kbd> 放大 2 倍／還原<br>
  <kbd>P</kbd> 子母畫面（小視窗浮在編輯器上方）<br>
  <kbd>F</kbd> 全螢幕　<kbd>R</kbd> 重新連線　<kbd>0</kbd> 還原縮放<br>
  <kbd>Win</kbd>+<kbd>←</kbd>／<kbd>→</kbd> 讓本視窗佔半個螢幕<br>
  <a class="small" id="hlsLink" target="_blank" rel="noopener">畫面一直出不來？試試相容模式（延遲較高）</a>
</div>

<script>
(() => {
  'use strict';

  // ===== 設定 =====
  // 可用網址參數覆寫：?t=teacher2  ?host=192.168.1.10  ?port=8889
  const STREAMS = [
    { id: 'teacher1', name: '教師 1' },
    { id: 'teacher2', name: '教師 2' },
  ];
  const params = new URLSearchParams(location.search);
  const HOST = params.get('host') || location.hostname || '127.0.0.1';
  const WEBRTC_PORT = params.get('port') || '8889';
  const HLS_PORT = params.get('hlsport') || '8888';

  const RETRY_OFFLINE_MS = 2000;   // 老師尚未開播時，每 2 秒重試
  const RETRY_ERROR_MS = 3000;     // 連線錯誤時重試間隔
  const STALL_LIMIT = 5;           // 連續 5 秒沒有新畫面就重連

  // ===== 元素 =====
  const $ = (id) => document.getElementById(id);
  const video = $('video'), stage = $('stage'), bar = $('bar');
  const dot = $('dot'), statusText = $('statusText'), statsEl = $('stats');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovSub = $('ovSub');

  // ===== 狀態 =====
  let current = STREAMS.some(s => s.id === params.get('t')) ? params.get('t') : STREAMS[0].id;
  let pc = null, sessionUrl = null, gen = 0, retryTimer = null, discTimer = null;
  let playing = false, lastFrames = -1, stallCount = 0;
  let lastBytes = 0, lastStatTime = 0;

  // ===== 介面 =====
  function setStatus(kind, text) {
    dot.className = kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : '';
    statusText.textContent = text;
  }
  function showOverlay(title, sub) {
    ovTitle.textContent = title; ovSub.textContent = sub || '';
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }
  function streamName(id) { return (STREAMS.find(s => s.id === id) || {}).name || id; }

  function renderStreamBtns() {
    const box = $('streamBtns');
    box.innerHTML = '';
    STREAMS.forEach(s => {
      const b = document.createElement('button');
      b.textContent = s.name;
      b.className = s.id === current ? 'active' : '';
      b.onclick = () => switchStream(s.id);
      box.appendChild(b);
    });
    $('hlsLink').href = `http://${HOST}:${HLS_PORT}/${current}`;
  }

  function switchStream(id) {
    if (id === current) return;
    current = id;
    const u = new URL(location.href);
    u.searchParams.set('t', id);
    history.replaceState(null, '', u);
    renderStreamBtns();
    resetZoom();
    connect();
  }

  // ===== WHEP 連線 =====
  function whepUrl() { return `http://${HOST}:${WEBRTC_PORT}/${current}/whep`; }

  function teardown() {
    clearTimeout(retryTimer); clearTimeout(discTimer);
    if (sessionUrl) {
      fetch(sessionUrl, { method: 'DELETE' }).catch(() => {});
      sessionUrl = null;
    }
    if (pc) {
      pc.ontrack = pc.onconnectionstatechange = null;
      try { pc.close(); } catch (e) {}
      pc = null;
    }
    playing = false; lastFrames = -1; stallCount = 0; lastBytes = 0; lastStatTime = 0;
  }

  function scheduleRetry(ms) {
    clearTimeout(retryTimer);
    const myGen = gen;
    retryTimer = setTimeout(() => { if (myGen === gen) connect(); }, ms);
  }

  function waitIceGathering(peer, timeoutMs) {
    if (peer.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise(resolve => {
      const t = setTimeout(done, timeoutMs);
      function done() {
        clearTimeout(t);
        peer.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
      function check() { if (peer.iceGatheringState === 'complete') done(); }
      peer.addEventListener('icegatheringstatechange', check);
    });
  }

  async function connect() {
    teardown();
    const myGen = ++gen;
    setStatus('wait', `連線中（${streamName(current)}）`);
    if (!video.srcObject) showOverlay('連線中…', `正在連線到 ${streamName(current)}`);

    const peer = new RTCPeerConnection({ iceServers: [], bundlePolicy: 'max-bundle' });
    pc = peer;
    const tr = peer.addTransceiver('video', { direction: 'recvonly' });
    lowLatency(tr.receiver);

    peer.ontrack = (ev) => {
      lowLatency(ev.receiver);
      // 沿用同一個 <video>，重連時子母畫面不會被關掉
      video.srcObject = new MediaStream([ev.track]);
      video.play().catch(() => {});
    };

    peer.onconnectionstatechange = () => {
      if (myGen !== gen) return;
      const st = peer.connectionState;
      if (st === 'connected') {
        clearTimeout(discTimer);
        // 真的收到畫面才顯示「直播中」（由下方監看程式切換）；老師端剛斷線時伺服器可能還接受連線但沒有畫面
        if (!playing) setStatus('wait', `已連線，等待畫面（${streamName(current)}）…`);
      } else if (st === 'disconnected') {
        setStatus('wait', '訊號中斷，等待恢復…');
        clearTimeout(discTimer);
        discTimer = setTimeout(() => { if (myGen === gen) connect(); }, 3000);
      } else if (st === 'failed') {
        setStatus('err', '連線失敗，重新連線中…');
        scheduleRetry(1000);
      }
    };

    try {
      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      await waitIceGathering(peer, 1500);
      if (myGen !== gen) return;

      const res = await fetch(whepUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: peer.localDescription.sdp,
      });
      if (myGen !== gen) return;

      if (res.status === 404) {
        setStatus('wait', `${streamName(current)} 尚未開始直播`);
        showOverlay(`${streamName(current)} 尚未開始直播`, '老師開始直播後，畫面會自動出現，不用重新整理。');
        video.srcObject = null;
        scheduleRetry(RETRY_OFFLINE_MS);
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const loc = res.headers.get('Location');
      sessionUrl = loc ? new URL(loc, whepUrl()).href : null;
      const answer = await res.text();
      await peer.setRemoteDescription({ type: 'answer', sdp: answer });
    } catch (err) {
      if (myGen !== gen) return;
      console.warn('WHEP 連線失敗：', err);
      setStatus('err', '無法連線到教師電腦，重試中…');
      if (!playing) showOverlay('無法連線到教師電腦', `請確認老師已開啟直播程式。（${HOST}）`);
      scheduleRetry(RETRY_ERROR_MS);
    }
  }

  function lowLatency(receiver) {
    // 盡量縮短播放緩衝（Chrome / Edge）
    try { receiver.jitterBufferTarget = 0; } catch (e) {}
    try { receiver.playoutDelayHint = 0; } catch (e) {}
  }

  // ===== 監看：統計數據 + 卡住自動重連（每秒檢查） =====
  setInterval(async () => {
    if (!pc || pc.connectionState !== 'connected') { statsEl.textContent = ''; return; }
    try {
      const report = await pc.getStats();
      let found = false;
      report.forEach(s => {
        if (s.type !== 'inbound-rtp' || s.kind !== 'video') return;
        found = true;
        const now = s.timestamp;
        const kbps = lastStatTime ? Math.round((s.bytesReceived - lastBytes) * 8 / (now - lastStatTime)) : 0;
        lastBytes = s.bytesReceived; lastStatTime = now;
        const buf = s.jitterBufferEmittedCount ? Math.round(s.jitterBufferDelay / s.jitterBufferEmittedCount * 1000) : 0;
        const fps = s.framesPerSecond ? Math.round(s.framesPerSecond) : 0;
        const res = s.frameWidth ? `${s.frameWidth}×${s.frameHeight}` : '';
        statsEl.textContent = `${res}　${fps} fps　${(kbps / 1000).toFixed(1)} Mbps　緩衝 ${buf} ms`;

        const frames = s.framesDecoded || 0;
        if (frames > 0 && frames > lastFrames) {
          stallCount = 0;
          if (!playing) {
            playing = true;
            hideOverlay();
            setStatus('ok', `直播中（${streamName(current)}）`);
          }
        } else {
          checkStall();
        }
        lastFrames = frames;
      });
      if (!found) checkStall();
    } catch (e) {}
  }, 1000);

  // 沒有新畫面：2 秒後先提示學生，STALL_LIMIT 秒後重新連線（老師關掉 OBS 時，畫面不會只剩一片黑）
  function checkStall() {
    stallCount++;
    if (stallCount === 2) {
      playing = false;
      setStatus('wait', '畫面暫停，等待老師的畫面…');
      showOverlay('畫面暫停', '老師的直播畫面中斷，恢復後會自動出現，不用重新整理。');
    }
    if (stallCount >= STALL_LIMIT) {
      setStatus('wait', '畫面停止更新，重新連線中…');
      connect();
    }
  }

  // ===== 縮放與拖曳 =====
  let scale = 1, tx = 0, ty = 0;
  const MIN = 1, MAX = 5;

  function applyTransform() {
    const w = stage.clientWidth, h = stage.clientHeight;
    tx = Math.min(0, Math.max(w - w * scale, tx));
    ty = Math.min(0, Math.max(h - h * scale, ty));
    video.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    $('zoomLabel').textContent = Math.round(scale * 100) + '%';
    stage.classList.toggle('zoomed', scale > 1);
  }
  function zoomAt(newScale, cx, cy) {
    newScale = Math.min(MAX, Math.max(MIN, newScale));
    tx = cx - (cx - tx) * (newScale / scale);
    ty = cy - (cy - ty) * (newScale / scale);
    scale = newScale;
    applyTransform();
  }
  function resetZoom() { scale = 1; tx = 0; ty = 0; applyTransform(); }
  function centerZoom(f) { zoomAt(scale * f, stage.clientWidth / 2, stage.clientHeight / 2); }

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAt(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });

  stage.addEventListener('dblclick', (e) => {
    if (scale > 1) resetZoom(); else zoomAt(2, e.clientX, e.clientY);
  });

  let drag = null;
  stage.addEventListener('pointerdown', (e) => {
    if (scale <= 1) return;
    drag = { x: e.clientX, y: e.clientY, tx, ty };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag) return;
    tx = drag.tx + (e.clientX - drag.x);
    ty = drag.ty + (e.clientY - drag.y);
    applyTransform();
  });
  const endDrag = () => { drag = null; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', applyTransform);

  $('zoomIn').onclick = () => centerZoom(1.25);
  $('zoomOut').onclick = () => centerZoom(1 / 1.25);
  $('zoomReset').onclick = resetZoom;

  // ===== 子母畫面 / 全螢幕 / 重連 =====
  async function togglePip() {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (video.readyState >= 1) await video.requestPictureInPicture();
    } catch (e) { console.warn(e); }
  }
  async function toggleFs() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (e) { console.warn(e); }
  }
  $('pipBtn').onclick = togglePip;
  $('fsBtn').onclick = toggleFs;
  $('reBtn').onclick = () => connect();
  $('helpBtn').onclick = () => $('help').classList.toggle('show');
  if (!document.pictureInPictureEnabled) $('pipBtn').disabled = true;
  video.addEventListener('enterpictureinpicture', () => $('pipBtn').classList.add('active'));
  video.addEventListener('leavepictureinpicture', () => $('pipBtn').classList.remove('active'));
  document.addEventListener('fullscreenchange', () =>
    $('fsBtn').classList.toggle('active', !!document.fullscreenElement));

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    switch (e.key) {
      case 'p': case 'P': togglePip(); break;
      case 'f': case 'F': toggleFs(); break;
      case 'r': case 'R': connect(); break;
      case '0': resetZoom(); break;
      case '+': case '=': centerZoom(1.25); break;
      case '-': case '_': centerZoom(1 / 1.25); break;
      case '?': $('help').classList.toggle('show'); break;
      default:
        if (/^[1-9]$/.test(e.key) && STREAMS[+e.key - 1]) switchStream(STREAMS[+e.key - 1].id);
    }
  });

  // ===== 工具列自動隱藏 =====
  let hideTimer = null;
  function pokeBar() {
    bar.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (playing && !bar.matches(':hover') && !$('help').classList.contains('show')) bar.classList.add('hidden');
    }, 2500);
  }
  document.addEventListener('mousemove', pokeBar);
  document.addEventListener('keydown', pokeBar);

  window.addEventListener('pagehide', teardown);

  // ===== 開始 =====
  renderStreamBtns();
  applyTransform();
  pokeBar();
  connect();
})();
</script>
</body>
</html>
